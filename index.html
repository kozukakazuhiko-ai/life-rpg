<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>人生はRPG | 開発版</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111827;color:#f9fafb}*{box-sizing:border-box}body{margin:0;max-width:700px;margin-inline:auto;padding:16px 16px 95px}h1{font-size:1.45rem}h2{font-size:1.15rem}p{line-height:1.6;color:#cbd5e1}.panel{background:#1f2937;border:1px solid #374151;border-radius:14px;padding:16px;margin:12px 0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 13px;background:#60a5fa;color:#0b1220;font-weight:700}button.secondary{background:#374151;color:#fff}button.danger{background:#fca5a5}input,textarea,select{width:100%;background:#111827;color:white;border:1px solid #64748b;border-radius:9px;padding:12px;margin:5px 0 12px}label{display:block;font-size:.9rem}nav{position:fixed;bottom:0;left:0;right:0;background:#111827;border-top:1px solid #374151;display:flex;justify-content:center;gap:5px;padding:9px}nav button{font-size:.78rem;padding:10px 7px;min-width:64px}section[hidden]{display:none}.notice{border-left:4px solid #fbbf24;padding:10px;background:#292524}.item{padding:10px 0;border-bottom:1px solid #374151}.actions{display:flex;gap:8px;flex-wrap:wrap}small{color:#cbd5e1}#message{min-height:1.5em;color:#fde68a}
</style></head><body>
<header><h1>人生はRPG <small>開発版 0.1</small></h1><p>今いる場所が、世界のすべてではない。</p><div id="message" role="status" aria-live="polite"></div></header>
<section id="home"><h2>Home</h2><div class="panel"><p>今日はどんな状態？ 自分の感覚で記録しよう。</p><label>HP（主観的な元気さ）<select id="hp"><option value="">未入力</option><option value="1">20</option><option value="2">40</option><option value="3">60</option><option value="4">80</option><option value="5">100</option></select></label><label>MP（主観的な余力）<select id="mp"><option value="">未入力</option><option value="1">20</option><option value="2">40</option><option value="3">60</option><option value="4">80</option><option value="5">100</option></select></label><label>睡眠時間（時間、任意）<input id="sleep" type="number" min="0" max="24" step="0.5" placeholder="例：7.5"></label><button id="saveStatus">今日の状態を保存</button><small>HP/MPは診断結果ではありません。</small></div><div class="panel"><h2>今日のDaily Quest</h2><div id="todayQuests"></div></div></section>
<section id="quest" hidden><h2>Quest</h2><div class="panel"><label>Quest名<input id="questName" maxlength="100" placeholder="小さな一歩を入力"></label><label>種類<select id="questType"><option value="Daily">Daily</option><option value="Season">Season</option><option value="Main">Main</option></select></label><label>難易度<select id="questDifficulty"><option value="easy">Easy</option><option value="normal">Normal</option><option value="hard">Hard</option></select></label><button id="addQuest">Questを作成</button></div><div class="panel" id="questList"></div></section>
<section id="want" hidden><h2>WantToDo</h2><div class="panel"><label>やってみたいこと<input id="wantTitle" maxlength="100" placeholder="気になることを記録"></label><label>カテゴリ<select id="wantCategory"></select></label><button id="addWant">追加</button></div><div class="panel" id="wantList"></div></section>
<section id="character" hidden><h2>Character</h2><div class="panel"><label>表示名（任意）<input id="displayName" maxlength="60" placeholder="あなたの名前"></label><button id="saveName">保存</button><p id="stats"></p></div></section>
<section id="help" hidden><h2>Help・データ管理</h2><div class="panel"><p>アプリは人生の正解を決めません。無理をせず、必要なら身近な人や専門の支援機関に相談してください。緊急時は地域の緊急窓口を利用してください。</p><p class="notice">記録はこのブラウザ内に保存されます。ブラウザデータの削除・端末変更などで消える場合があります。定期的にバックアップしてください。</p><div class="actions"><button id="export">JSONバックアップを保存</button><button id="importButton" class="secondary">JSONを復元</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><hr><button id="erase" class="danger">全データを削除</button></div></section>
<nav aria-label="メインメニュー"><button data-tab="home">Home</button><button data-tab="quest">Quest</button><button data-tab="want">WantToDo</button><button data-tab="character">Character</button><button data-tab="help">Help</button></nav>
<script>
'use strict';
const KEY='life-rpg-v3';const TYPES=['Daily','Season','Main'];const DIFF=['easy','normal','hard'];const CATS=['行きたい','やってみたい','欲しい','学びたい','仕事','成長','人間関係','趣味'];
const empty=()=>({dataVersion:3,profile:{displayName:''},dailyStatuses:{},todayGoals:{},quests:[],wantToDos:[],expTransactions:[],saveInfo:{updatedAt:'',appVersion:'0.1'}});
const el=id=>document.getElementById(id);const uid=()=>crypto.randomUUID();const iso=()=>new Date().toISOString();const date=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const valid=d=>d&&d.dataVersion===3&&d.profile&&typeof d.profile.displayName==='string'&&d.dailyStatuses&&typeof d.dailyStatuses==='object'&&!Array.isArray(d.dailyStatuses)&&d.todayGoals&&typeof d.todayGoals==='object'&&Array.isArray(d.quests)&&Array.isArray(d.wantToDos)&&Array.isArray(d.expTransactions)&&d.quests.every(q=>q&&typeof q.id==='string'&&typeof q.name==='string'&&TYPES.includes(q.type)&&DIFF.includes(q.difficulty)&&['not_started','in_progress','on_hold','completed'].includes(q.status))&&d.wantToDos.every(w=>w&&typeof w.id==='string'&&typeof w.title==='string'&&CATS.includes(w.category))&&d.expTransactions.every(t=>t&&typeof t.questId==='string'&&Number.isInteger(t.amount)&&['award','reversal'].includes(t.kind));
let state=empty();let persistent=true;function notify(msg){el('message').textContent=msg}function save(){state.saveInfo={updatedAt:iso(),appVersion:'0.1'};try{localStorage.setItem(KEY,JSON.stringify(state));persistent=true;notify('保存しました');return true}catch(e){persistent=false;notify('保存に失敗しました。バックアップを取得してください。');return false}}function update(fn){const before=structuredClone(state);fn();if(!save())state=before;render()}
try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(valid(d))state=d;else notify('保存データの形式が不正です。上書きせず、バックアップを確認してください。')}}catch(e){notify('保存データを読み込めません。既存データを保護するため操作に注意してください。')}
const expFor=q=>({Daily:[10,25,50],Season:[100,250,500],Main:[500,1000,2000]})[q.type][DIFF.indexOf(q.difficulty)];
const total=()=>Math.max(0,state.expTransactions.reduce((s,t)=>s+t.amount,0));const level=()=>Math.floor(Math.sqrt(total()/100))+1;
function complete(id){update(()=>{const q=state.quests.find(q=>q.id===id);if(!q||q.status==='completed')return;q.status='completed';q.completedAt=iso();q.updatedAt=iso();const active=state.expTransactions.filter(t=>t.questId===id).reduce((s,t)=>s+t.amount,0);if(active===0)state.expTransactions.push({transactionId:uid(),questId:id,kind:'award',amount:expFor(q),createdAt:iso(),relatedTransactionId:null})})}
function undo(id){update(()=>{const q=state.quests.find(q=>q.id===id);if(!q||q.status!=='completed')return;q.status='not_started';q.completedAt=null;q.updatedAt=iso();const active=state.expTransactions.filter(t=>t.questId===id).reduce((s,t)=>s+t.amount,0);if(active>0)state.expTransactions.push({transactionId:uid(),questId:id,kind:'reversal',amount:-active,createdAt:iso(),relatedTransactionId:null})})}
function button(label,fn,cls='secondary'){const b=document.createElement('button');b.textContent=label;b.className=cls;b.addEventListener('click',fn);return b}function itemText(parent,text){const p=document.createElement('p');p.textContent=text;parent.append(p)}
function render(){el('questList').replaceChildren();state.quests.filter(q=>!q.archived).forEach(q=>{const d=document.createElement('div');d.className='item';itemText(d,`${q.name}｜${q.type}｜${q.difficulty}｜${q.status}`);const a=document.createElement('div');a.className='actions';if(q.status==='completed')a.append(button('完了を取り消す',()=>undo(q.id)));else a.append(button('完了 ＋EXP',()=>complete(q.id)));a.append(button('非表示',()=>{if(confirm('このQuestをアーカイブしますか？'))update(()=>{q.archived=true})}));d.append(a);el('questList').append(d)});el('wantList').replaceChildren();state.wantToDos.filter(w=>!w.archived).forEach(w=>{const d=document.createElement('div');d.className='item';itemText(d,`${w.title}｜${w.category}`);const a=document.createElement('div');a.className='actions';a.append(button('Main Questにする',()=>{if(!confirm('この内容からMain Questを作成しますか？'))return;update(()=>state.quests.push(newQuest(w.title,'Main','normal',w.id)))}));a.append(button('非表示',()=>update(()=>{w.archived=true})));d.append(a);el('wantList').append(d)});el('stats').textContent=`累計EXP：${total()} ／ Level：${level()} ／ 完了Quest：${state.quests.filter(q=>q.status==='completed').length}`;el('displayName').value=state.profile.displayName;const s=state.dailyStatuses[date()]||{};el('hp').value=s.hp??'';el('mp').value=s.mp??'';el('sleep').value=s.sleepMinutes==null?'':s.sleepMinutes/60;el('todayQuests').replaceChildren();const todays=state.quests.filter(q=>!q.archived&&q.type==='Daily'&&q.status!=='completed');if(!todays.length)itemText(el('todayQuests'),'未完了のDaily Questはありません');todays.forEach(q=>itemText(el('todayQuests'),q.name))}
function newQuest(name,type,difficulty,sourceWantId=null){return{id:uid(),name,type,status:'not_started',details:'',priority:2,difficulty,deadline:null,parentQuestId:null,sourceWantId,createdAt:iso(),updatedAt:iso(),completedAt:null,reflection:'',archived:false}}
CATS.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;el('wantCategory').append(o)});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==b.dataset.tab);window.scrollTo(0,0)});
el('addQuest').onclick=()=>{const n=el('questName').value.trim();if(!n)return notify('Quest名を入力してください');update(()=>state.quests.push(newQuest(n,el('questType').value,el('questDifficulty').value)));el('questName').value=''};
el('addWant').onclick=()=>{const n=el('wantTitle').value.trim();if(!n)return notify('やりたいことを入力してください');update(()=>state.wantToDos.push({id:uid(),title:n,category:el('wantCategory').value,memo:'',createdAt:iso(),updatedAt:iso(),archived:false}));el('wantTitle').value=''};
el('saveName').onclick=()=>update(()=>{state.profile.displayName=el('displayName').value.trim()});
el('saveStatus').onclick=()=>{const sleep=el('sleep').value;const mins=sleep===''?null:Number(sleep)*60;if(mins!==null&&(!Number.isInteger(mins)||mins<0||mins>1440))return notify('睡眠時間は0〜24時間で入力してください');update(()=>{state.dailyStatuses[date()]={hp:el('hp').value?Number(el('hp').value):null,mp:el('mp').value?Number(el('mp').value):null,sleepMinutes:mins}})};
el('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`life-rpg-backup-${date()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('バックアップファイルを作成しました')};
el('importButton').onclick=()=>el('importFile').click();el('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>5_000_000)throw Error('ファイルが大きすぎます');const d=JSON.parse(await f.text());if(!valid(d))throw Error('対応していないデータ形式です');if(!confirm(`Quest ${d.quests.length}件、WantToDo ${d.wantToDos.length}件を復元します。現在のデータは上書きされます。続けますか？`))return;const old=state;state=d;if(!save()){state=old;throw Error('保存に失敗しました')}render()}catch(err){notify(`復元できません：${err.message}`)}finally{e.target.value=''}};
el('erase').onclick=()=>{if(!confirm('全データを削除しますか？ 元に戻せません。'))return;if(!confirm('最終確認：本当にすべての記録を削除しますか？'))return;try{localStorage.removeItem(KEY);state=empty();render();notify('全データを削除しました')}catch(e){notify('削除に失敗しました')}};
render();
if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {})); }
</script></body></html>
